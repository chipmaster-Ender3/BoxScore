.flag { margin-top: 12px; font-weight: 700; color: var(--ink); }
.ins { margin-top: 18px; }

.ins ul { margin: 0; padding-left: 20px; color: var(--ink2); } .ins li + li { margin-top: 4px; }
.hero { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: clamp(12px, 2.5vw, 20px); min-height: clamp(150px, 22vw, 230px); padding: clamp(14px, 2.6vw, 26px);

.hero > * { position: relative; }
.hero .top { margin: 0; } .hero .brand { color: #fff; }
.ht { font: 800 clamp(30px, 6vw, 64px)/.95 var(--dsp); text-transform: uppercase; letter-spacing: .02em; margin: 14px 0 4px; }
.hs { font: 600 clamp(14px, 1.8vw, 18px)/1.3 var(--ui); opacity: .92; }
.aceF { display: inline-flex; align-items: center; margin-left: 10px; padding: 4px 10px; border-radius: 8px; background: var(--live); color: #fff; font: 800 clamp(14px, 2vw, 22px)/1 var(--dsp); letter-spacing: .08em; animation: aceIn .5s ease-out; }
@keyframes aceIn { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .aceF { animation: none; } }
.stkF { display: inline-flex; align-items: center; margin-left: 10px; padding: 4px 10px; border-radius: 8px; background: var(--ball); color: #0B1418; font: 800 clamp(13px, 1.8vw, 20px)/1 var(--dsp); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: aceIn .5s ease-out; }
.stkF.stk-mp { background: #FFB020; }
@media (prefers-reduced-motion: reduce) { .stkF { animation: none; } }
body.tv .stkF { font-size: calc(min(5.4vh, 3.6vw) * var(--k, 1)); padding: .8vh 1.2vw; border-radius: 1.4vh; margin-left: 1.4vw; animation: aceIn .5s ease-out, stkP 1.6s ease-in-out .5s infinite; }
@keyframes stkP { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { body.tv .stkF { animation: none; } }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.fact { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); min-width: 0; }
.fact svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--ink2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fact small { display: block; color: var(--muted); font: 600 12px/1.2 var(--ui); text-transform: uppercase; letter-spacing: .05em; }
.fact b { display: block; font: 700 clamp(15px, 1.8vw, 18px)/1.25 var(--ui); overflow-wrap: anywhere; }
.stats { margin-top: clamp(12px, 2.5vw, 20px); }

.sr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sr:last-child { border-bottom: 0; }
.sr .v { font: 800 clamp(20px, 3vw, 30px)/1 var(--dsp); } .sr .v.b { text-align: right; } .sr .v small { font: 600 13px var(--ui); color: var(--muted); margin: 0 6px; }
.sr .l { color: var(--ink2); font: 600 clamp(13px, 1.6vw, 15px)/1.2 var(--ui); text-align: center; }
.sr .bar { grid-column: 1 / -1; display: flex; gap: 4px; height: 6px; }
.sr .bar i { border-radius: 4px; background: var(--ink2); opacity: .35; } .sr .bar i.w { background: var(--win); opacity: 1; }
.shead { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; color: var(--muted); font: 700 13px var(--ui); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.shead span:last-child { text-align: right; }
.msg { text-align: center; padding: 48px 12px; color: var(--ink2); }
.msg b { display: block; color: var(--ink); font: 800 26px/1.2 var(--dsp); text-transform: uppercase; margin-bottom: 8px; }
.foot { margin-top: 22px; text-align: center; color: var(--muted); font-size: 14px; }
.foot a { color: var(--ink2); }
/* 7.53: modo TV — placar grande que ocupa a tela toda (TV, computador ligado na TV ou celular espelhado) */
.tvb { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); background: rgba(6,14,20,.45); color: #fff; font: 700 clamp(13px, 1.5vw, 15px)/1 var(--ui); cursor: pointer; }

.tvb:focus-visible, .tvc button:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }
.topR { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.tvc, .tvq, .tvst { display: none; }
body.tv { --bg: #0B151B; --card: #12222B; --ink: #F4F7F5; --ink2: #B9C6CC; --muted: #8FA3AC; --line: #24404D; --win: #D7F24A; overflow: hidden; }
body.tv.idle { cursor: none; }
body.tv .wrap { max-width: none; height: 100vh; height: 100dvh; display: flex; flex-direction: column; padding: 3vh 3.5vw; }

body.tv .hero::before { display: none; }

  function goFull() { var r = document.documentElement, f = r.requestFullscreen || r.webkitRequestFullscreen; if (f && !fsEl()) try { var p = f.call(r); if (p && p.catch) p.catch(function () {}); } catch (e) {} }

  // diminui as letras até o placar caber (nomes longos, duplas, telas baixas)
  function tvFit() {

  }

      $('tvFull').hidden = !(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
      if (!tvCounted && window.BXTel) { tvCounted = true; var k2 = 'boxscore.live.tv', dd2 = new Date().toISOString().slice(0, 10), sv2 = ''; try { sv2 = localStorage.getItem(k2) || ''; } catch (e) {} if (sv2 !== id + '|' + dd2) { try { localStorage.setItem(k2, id + '|' + dd2); } catch (e) {} try { BXTel.count('v_live_tv'); } catch (e) {} } }

  document.addEventListener('visibilitychange', keepAwake);
  try { firebase.initializeApp(FB_CFG); } catch (e) {}
  var db = firebase.firestore(), unsub = null;

  try {
    if (window.BXTel) {
      BXTel.init({ module: 'aovivo', build: '7.91', lang: LG, getDb: function () { return db; }, getUid: function () { return null; } });
