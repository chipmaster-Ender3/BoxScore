/* BoxScore — Placar ao vivo (aovivo 1.1.0, Beta 7.50). Página pública: abre pelo link, sem login, e acompanha live/{id}. */
:root { --bg: #0E1A21; --card: #14252E; --ink: #F4F7F5; --ink2: #B9C6CC; --muted: #8FA3AC; --line: #24404D; --live: #D92D20; --ball: #D7F24A; --win: #D7F24A;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--ui); -webkit-text-size-adjust: 100%; }
.wrap { max-width: 1100px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) clamp(12px, 3vw, 32px) 32px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: clamp(12px, 2.5vw, 24px); }
.brand { font: 800 clamp(18px, 2.4vw, 26px)/1 var(--dsp); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); text-decoration: none; }

.pill i { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
.pill.end { background: var(--muted); } .pill.end i { display: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill i { animation: none; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(14px, 3vw, 28px); }
.board { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0; }
.row { display: contents; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; padding: clamp(10px, 2vw, 18px) 0; border-bottom: 1px solid var(--line); }
.row:last-child .who, .row:last-child .cells { border-bottom: 0; }
.srv { width: clamp(12px, 1.6vw, 18px); height: clamp(12px, 1.6vw, 18px); border-radius: 50%; flex: none; background: transparent; }
.srv.on { background: var(--ball); box-shadow: 0 0 0 2px rgba(0,0,0,.15) inset; }

.row.won .nm { color: var(--win); }
.cells { display: flex; align-items: center; justify-content: flex-end; gap: clamp(6px, 1.6vw, 18px); border-bottom: 1px solid var(--line); padding-left: 12px; }

.c sup { font: 700 .45em/1 var(--ui); position: absolute; top: -.2em; right: -.45em; color: var(--muted); }
.c.cur { color: var(--ink); }
.c.pt { min-width: clamp(64px, 10vw, 120px); padding: 6px 8px; border-radius: 12px; background: var(--ball); color: #0B1418; font-size: clamp(36px, 6.4vw, 72px); }
.c.win { color: var(--win); }
.meta { margin-top: 14px; color: var(--muted); font-size: clamp(13px, 1.6vw, 16px); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.flag { margin-top: 12px; font-weight: 700; color: var(--ink); }
.ins { margin-top: 18px; }
.ins h2 { font: 800 18px/1.2 var(--dsp); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; }
.ins ul { margin: 0; padding-left: 20px; color: var(--ink2); } .ins li + li { margin-top: 4px; }
.hero { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: clamp(12px, 2.5vw, 20px); min-height: clamp(150px, 22vw, 230px); padding: clamp(14px, 2.6vw, 26px);

.hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,14,20,.86) 0%, rgba(6,14,20,.55) 45%, rgba(6,14,20,.1) 100%); }
.hero > * { position: relative; }
.hero .top { margin: 0; } .hero .brand { color: #fff; }
.ht { font: 800 clamp(30px, 6vw, 64px)/.95 var(--dsp); text-transform: uppercase; letter-spacing: .02em; margin: 14px 0 4px; }
.hs { font: 600 clamp(14px, 1.8vw, 18px)/1.3 var(--ui); opacity: .92; }
.aceF { display: inline-flex; align-items: center; margin-left: 10px; padding: 4px 10px; border-radius: 8px; background: var(--live); color: #fff; font: 800 clamp(14px, 2vw, 22px)/1 var(--dsp); letter-spacing: .08em; animation: aceIn .5s ease-out; }

.fact small { display: block; color: var(--muted); font: 600 12px/1.2 var(--ui); text-transform: uppercase; letter-spacing: .05em; }
.fact b { display: block; font: 700 clamp(15px, 1.8vw, 18px)/1.25 var(--ui); overflow-wrap: anywhere; }

.sr:last-child { border-bottom: 0; }

.shead span:last-child { text-align: right; }
.msg { text-align: center; padding: 48px 12px; color: var(--ink2); }
.msg b { display: block; color: var(--ink); font: 800 26px/1.2 var(--dsp); text-transform: uppercase; margin-bottom: 8px; }
.foot { margin-top: 22px; text-align: center; color: var(--muted); font-size: 14px; }
.foot a { color: var(--ink2); }

    var sk = SURF[d.surf] ? d.surf : 'outro';
    if (heroKey !== sk && window.BXHero) { heroKey = sk; BXHero.apply($('hero'), 'live_' + sk); }
    $('ht').textContent = T(d.sport === 'tennis' || !d.sport ? 'tennis' : d.sport) + ' · ' + T(doubles ? 'doubles2' : 'singles');
    $('hs').textContent = [SURF[d.surf] ? T(d.surf) : '', d.place].filter(Boolean).join(' · ');
    // ace: aparece por 8 s ao lado de quem sacou
    var la = sc.last || {};
    if (la.n && la.n !== aceSeen) { if (aceSeen >= 0 && la.ace) aceUntil = Date.now() + 8000; else if (aceSeen < 0 && la.ace && Date.now() - (d.updatedAt || 0) < 8000) aceUntil = (d.updatedAt || Date.now()) + 8000; aceSeen = la.n; }
    var aceOn = la.ace && Date.now() < aceUntil && !over ? la.w : -1;
    var m = $('main'); m.textContent = ''; var card = el('div', 'card'), b = el('div', 'board');
    var sets = (sc.sets || []).map(parseSet).filter(Boolean);
    [0, 1].forEach(function (t) {
      var r = el('div', 'row' + (over && sc.w === t ? ' won' : '')), who = el('div', 'who');
      var sv = el('span', 'srv' + (!over && sc.srv === t ? ' on' : '')); if (!over && sc.srv === t) sv.title = T('srv'); who.appendChild(sv);
      who.appendChild(el('span', 'nm', d.names[t] || ''));
      if (aceOn === t) who.appendChild(el('span', 'aceF', T('ace')));
      r.appendChild(who);
      var cells = el('div', 'cells');
      sets.forEach(function (st) { var mine = t ? st.b : st.a, oth = t ? st.a : st.b, c = el('span', 'c' + (mine > oth ? ' win' : ''), String(mine)); if (st.tb != null && mine < oth) c.appendChild(el('sup', '', String(st.tb))); cells.appendChild(c); });
      if (!over) { cells.appendChild(el('span', 'c cur', String((sc.g || [0, 0])[t]))); cells.appendChild(el('span', 'c pt', String((sc.p || ['0', '0'])[t] || '0'))); }
      r.appendChild(cells); b.appendChild(r);
    });
    card.appendChild(b);
    if (over) card.appendChild(el('div', 'flag', Tf('win', d.names[sc.w])));
    else if (!d.on) card.appendChild(el('div', 'flag', T('stopped')));
    else if (sc.tb) card.appendChild(el('div', 'flag', T('tb')));
    // informações da partida
    var fx = el('div', 'facts');
    if (d.place) fx.appendChild(fact('place', T('place'), d.place));
    if (SURF[d.surf]) fx.appendChild(fact('surf', T('surf'), T(d.surf)));
    if (d.playAt || d.startedAt) { fx.appendChild(fact('start', T('start'), startTxt(d.playAt || d.startedAt))); fx.appendChild(fact('dur', T('dur'), durNow(d), 'dur')); }
    if (live) fx.appendChild(fact('upd', T('upd2'), updTxt(d.updatedAt || Date.now()), 'upd'));
    card.appendChild(fx);
    if (!net) card.appendChild(el('div', 'meta', T('net')));
    m.appendChild(card);
    // estatísticas
    var S2 = sc.st;
    if (S2 && S2.pts && S2.pts[0] + S2.pts[1] > 0) {
      var sb2 = el('div', 'card stats'); sb2.appendChild(el('h2', '', T('stats')));
      var hd = el('div', 'shead'); hd.appendChild(el('span', '', d.names[0])); hd.appendChild(el('span', '', '')); hd.appendChild(el('span', '', d.names[1])); sb2.appendChild(hd);
      var tp = S2.pts[0] + S2.pts[1];
      srow(sb2, T('pts'), String(S2.pts[0]), String(S2.pts[1]), S2.pts[0], S2.pts[1], pctS(S2.pts[0], tp), pctS(S2.pts[1], tp));
      if (S2.ace && S2.ace[0] + S2.ace[1] > 0) srow(sb2, T('aces'), String(S2.ace[0]), String(S2.ace[1]), S2.ace[0], S2.ace[1]);
      srow(sb2, T('sp'), pctS(S2.spw[0], S2.sp[0]), pctS(S2.spw[1], S2.sp[1]), S2.sp[0] ? S2.spw[0] / S2.sp[0] : 0, S2.sp[1] ? S2.spw[1] / S2.sp[1] : 0, S2.spw[0] + '/' + S2.sp[0], S2.spw[1] + '/' + S2.sp[1]);
      srow(sb2, T('rp'), pctS(S2.rpw[0], S2.rp[0]), pctS(S2.rpw[1], S2.rp[1]), S2.rp[0] ? S2.rpw[0] / S2.rp[0] : 0, S2.rp[1] ? S2.rpw[1] / S2.rp[1] : 0, S2.rpw[0] + '/' + S2.rp[0], S2.rpw[1] + '/' + S2.rp[1]);
      srow(sb2, T('bp'), S2.bpC[0] + '/' + S2.bpO[0], S2.bpC[1] + '/' + S2.bpO[1], S2.bpC[0], S2.bpC[1]);
      m.appendChild(sb2);
    }
    if (over && d.ins && d.ins.length) { var ins = el('div', 'card ins stats'); ins.appendChild(el('h2', '', T('sum'))); var ul = el('ul'); d.ins.forEach(function (x) { ul.appendChild(el('li', '', x)); }); ins.appendChild(ul); m.appendChild(ins); }
  }
  setInterval(function () { if (!last) return; var u = $('upd'); if (u) u.textContent = updTxt(last.updatedAt || Date.now()); var du = $('dur'); if (du) du.textContent = durNow(last); if (aceUntil && Date.now() > aceUntil) { aceUntil = 0; render(); } }, 1000);
  if (!id) { msg(T('noid_t'), T('noid')); return; }
  try { firebase.initializeApp(FB_CFG); } catch (e) {}
  var db = firebase.firestore(), unsub = null;
  function watch() {
    if (unsub) try { unsub(); } catch (e) {}
    unsub = db.collection('live').doc(id).onSnapshot(function (snap) {
      net = true;
      if (!snap.exists) { if (!last) msg(T('gone_t'), T('gone')); else { last.on = false; render(); } return; }
      last = snap.data(); lastAt = Date.now(); render();
    }, function (err) {
      var c = err && err.code;
      if (c === 'permission-denied' || c === 'not-found') { if (last && last.sc && (last.sc.w === 0 || last.sc.w === 1)) { last.expAt = 0; render(); } else msg(T('gone_t'), T('gone')); return; }
      net = false; render(); setTimeout(watch, 5000);
    });
  }
  window.addEventListener('online', function () { net = true; watch(); });
  window.addEventListener('offline', function () { net = false; render(); });
  watch();
})();
</script>
