      { p: ['0', '0'], g: [3, 2], k: { t: '', p: -1 } }, { p: ['15', '0'], g: [3, 2], k: { t: '', p: -1 } }, { p: ['30', '0'], g: [3, 2], k: { t: '', p: -1 }, ace: true },
      { p: ['30', '15'], g: [3, 2], k: { t: '', p: -1 } }, { p: ['40', '15'], g: [3, 2], k: { t: 'bp', p: 0 } }, { p: ['0', '0'], g: [4, 2], k: { t: '', p: -1 } }];
    var fi = 0;
    var tick = function () {
      var f = frames[fi % frames.length]; fi++;
      last = { on: true, names: [nA, nB], sc: { sets: ['6-4'], g: f.g, p: f.p, srv: 1, tb: false, w: -1, sw: [1, 0], k: f.k, st: st0, last: { w: 0, ace: !!f.ace, n: 60 + fi } } };
      render(last);
    };
    tick(); if (DEMO !== 'still') setInterval(tick, 2200);
    if (DEMO === 'stats') showStats(last, Tf('setN', 1), 0);
    if (DEMO === 'end') { last = { on: true, names: [nA, nB], sc: { sets: ['6-4', '7-6(5)'], g: [0, 0], p: ['', ''], srv: -1, tb: false, w: 0, sw: [2, 0], k: { t: '', p: -1 }, st: st0, last: { w: 0, ace: false, n: 90 } } }; prev = null; render(last); }
    return;
  }

  // ---------- ao vivo: stream/{chave} → live/{id} ----------
  if (!KEY) return;
  try { firebase.initializeApp(FB_CFG); } catch (e) {}
  var db = firebase.firestore(), unL = null, lid = null;
  try { if (window.BXTel) { BXTel.init({ module: 'aovivo', build: '7.76', lang: LG, getDb: function () { return db; }, getUid: function () { return null; } }); BXTel.count('v_overlay'); } } catch (e) {}
  function follow(id) {
    if (id === lid) return; lid = id;
    if (unL) try { unL(); } catch (e) {} unL = null; hideAll(); last = null;
    if (!id) return;
    unL = db.collection('live').doc(id).onSnapshot(function (s) {
      if (!s.exists) { hideAll(); return; }
      last = s.data(); render(last);
    }, function () { hideAll(); setTimeout(function () { var x = lid; lid = null; follow(x); }, 8000); });
  }
  db.collection('stream').doc(KEY).onSnapshot(function (s) {
    if (!s.exists) { follow(''); return; }
    var x = s.data() || {};
    OPT.pos = x.pos === 't' ? 't' : 'b'; OPT.st = x.st !== false; applyOpt();
    if (x.lg && !qs.get('lg')) setLang(x.lg);
    follow(String(x.lid || ''));
  }, function () { setTimeout(function () { location.reload(); }, 15000); });
})();
</script>
