  // Telas principais (sem voltar): Feed, Jogos (abertos/meus), Grupos (lista), Avisos.
  // Telas internas (com ← no topo, voltar do Android e Esc): Marcar um jogo, Ajustes, Conversas, grupo aberto, torneio aberto.
  // Janelas por cima (publicação, conversa, menus, perfil…): o voltar do Android e o Esc fecham a de cima.
  var NAV = { stack: [], last: null, lastK: '', popping: false, armed: false, ignore: 0 };
  function navSnap() { return { tab: S.tab, gid: S.gid, gtab: S.gtab, tid: S.tid, ttab: S.ttab, gf: S.gf }; }
  function navKey(x) { return x.tab + '|' + (x.tab === 'groups' ? (x.gid || '') + '|' + (x.gid && x.gtab === 'tor' ? (x.tid || '') : '') : ''); }
  function navRoot(x) { return x.tab === 'feed' || x.tab === 'find' || x.tab === 'mine' || x.tab === 'home' || (x.tab === 'groups' && !x.gid); }
  function topDlg() { var k = document.body.children; for (var i = k.length - 1; i >= 0; i--) { var e = k[i]; if (e.matches && e.matches('.chat, .um, .invs, .bxp')) return e; } return null; }
  function closeDlg(d) {
    var b = d.querySelector('.ct > .btn') || d.querySelector('.card-head .btn, [data-close]');
    if (b) b.click(); else d.remove();
  }
  function navTrack() {
    var cur = navSnap(), k = navKey(cur);
    if (NAV.last && NAV.lastK !== k) {
      if (NAV.popping) NAV.popping = false;
      else if (navRoot(cur)) NAV.stack = [];                       // foi para uma tela principal: começa de novo
      else { NAV.stack.push(NAV.last); if (NAV.stack.length > 30) NAV.stack.shift(); }
    }
    NAV.last = cur; NAV.lastK = k;
    var nb = $('navBack'); if (nb) { nb.hidden = navRoot(cur); nb.setAttribute('aria-label', BXMods.t('back')); nb.title = BXMods.t('back'); }
    navGuard();
  }
  function navBack() {
    var d = topDlg(); if (d) { closeDlg(d); return; }
    var cur = navSnap(); if (navRoot(cur)) return;
    var prev = NAV.stack.pop();
    if (prev) { NAV.popping = true; S.tab = prev.tab; S.gid = prev.gid; S.gtab = prev.gtab; S.tid = prev.tid; S.ttab = prev.ttab; S.gf = prev.gf; }
    else if (cur.tab === 'groups' && cur.gid && cur.gtab === 'tor' && cur.tid) S.tid = '';
    else if (cur.tab === 'groups' && cur.gid) S.gid = '';
    else S.tab = 'feed';
    paint(); try { window.scrollTo(0, 0); } catch (e) {}
  }
  // uma entrada no histórico do navegador enquanto houver tela interna ou janela aberta: o voltar do Android cai aqui
  function navGuard() {
    var deep = !!topDlg() || (S.user && !navRoot(navSnap()));
    try {
      if (deep && !NAV.armed) { history.pushState({ bxnav: 1 }, ''); NAV.armed = true; }
      else if (!deep && NAV.armed) { NAV.armed = false; NAV.ignore++; history.back(); }
    } catch (e) {}
  }
  window.addEventListener('popstate', function () {
    if (NAV.ignore) { NAV.ignore--; return; }
    if (!NAV.armed) return;
    NAV.armed = false; navBack(); setTimeout(navGuard, 0);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented) return;
    var d = topDlg(); if (d) { e.preventDefault(); closeDlg(d); return; }
    if (S.user && !navRoot(navSnap())) { e.preventDefault(); navBack(); }
  });
  try { new MutationObserver(function () { navGuard(); }).observe(document.body, { childList: true }); } catch (e) {}
  $('navBack').addEventListener('click', navBack);
  function paint() {
    if (!S.user) return;
    paintTabs(); paintNotices();
    $('pHome').hidden = S.tab !== 'home'; $('pGroups').hidden = S.tab !== 'groups'; $('pFind').hidden = S.tab !== 'find'; $('pMine').hidden = S.tab !== 'mine'; $('pNew').hidden = S.tab !== 'neu'; $('pChat').hidden = S.tab !== 'chat'; $('pFeed').hidden = S.tab !== 'feed'; $('pSet').hidden = S.tab !== 'set';
    var uid = S.user.uid, now = Date.now(), all = Object.keys(S.games).map(function (k) { return S.games[k]; });
    var js = $('jSeg'); js.hidden = !(S.tab === 'find' || S.tab === 'mine'); js.textContent = '';
    var invL = invList(all, uid, now);
    [['inv', T('jt_inv')], ['play', T('jt_play')], ['done', T('jt_done')], ['find', T('j_open')]].forEach(function (o) {
      var on = o[0] === 'find' ? S.tab === 'find' : (S.tab === 'mine' && S.jt === o[0]);
      var bt = h('button', { type: 'button', 'data-jt': o[0], 'aria-pressed': String(on), on: { click: function () { if (o[0] === 'find') S.tab = 'find'; else { S.tab = 'mine'; S.jt = o[0]; } paint(); } } }, [h('span', { text: o[1] })]);
      if (o[0] === 'inv' && invL.length) bt.appendChild(h('span', { cls: 'jn', text: String(invL.length) }));
      js.appendChild(bt);
    });
    var lh = $('lHome'); lh.textContent = ''; if (S.tab === 'home') paintHome(lh);
    var ls2 = $('lSet'); ls2.textContent = ''; if (S.tab === 'set') paintSettings(ls2);
    var lg = $('lGroups'); lg.textContent = ''; if (S.tab === 'groups') paintGroups(lg);
    var lf = $('lFind'); lf.textContent = '';
    if (S.tab === 'find') {
      var q = norm($('fCity').value);
      var list = all.filter(function (g) { return g.hostUid !== uid && !isInv(g, uid) && (g.accepted || []).indexOf(uid) < 0 && (g.declined || []).indexOf(uid) < 0 && g.status === 'open' && g.startAt > now - 3 * HOUR && (!P.days || g.startAt < now + P.days * 86400000) && (!q || norm(g.city).indexOf(q) >= 0 || norm(g.place).indexOf(q) >= 0); }).sort(function (a, b) { return a.startAt - b.startAt; });
      if (S.loading && !all.length) note(lf, T('loading')); else if (S.err) note(lf, T('err')); else if (!list.length) note(lf, T('e_find'));
      list.forEach(function (g) { lf.appendChild(cardFind(g)); });
    }
    var lm = $('lMine'); lm.textContent = '';
    if (S.tab === 'mine') {
      if (S.loading && !all.length) note(lm, T('loading')); else if (S.err) note(lm, T('err'));
      else if (S.jt === 'inv') { if (!invL.length) note(lm, T('e_inv')); invL.forEach(function (g) { lm.appendChild(cardFind(g)); }); }
      else if (S.jt === 'done') paintDone(lm, all, uid, now);
      else {
        // 7.21: os jogos que eu vou jogar, do mais próximo para o mais distante
        var play = all.filter(function (g) { var me = g.hostUid === uid || (g.accepted || []).indexOf(uid) >= 0 || (g.asked || []).indexOf(uid) >= 0; return me && (g.status === 'open' || g.status === 'full' || g.status === 'started') && g.startAt > now - 24 * HOUR; }).sort(function (a, b) { return a.startAt - b.startAt; });
        if (!play.length) note(lm, T('e_play'));
        play.forEach(function (g) { lm.appendChild(cardMine(g)); });
      }
    }
    if (S.tab === 'neu') paintForm();
    var lf2 = $('lFeed'); lf2.textContent = ''; if (S.tab === 'feed') paintFeed(lf2);
    var lc = $('lChat'); lc.textContent = '';
    if (S.tab === 'chat') { if (S.loading && !S.chats.length) note(lc, T('loading')); else paintChats(lc); }
    navTrack();
  }

  // ---------- início ----------
  $('ttl').textContent = 'BoxScore'; $('ver').textContent = 'v' + VERSION; heroTop();
  var b = $('back'); b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS.ball + '</svg>'; b.appendChild(h('span', { text: BXMods.t('placar') })); b.setAttribute('aria-label', BXMods.t('back')); b.addEventListener('click', function () { BXMods.mark('placar'); location.href = '../placar/'; });
  window.addEventListener('hashchange', function () { S.hashDone = false; S.draftDone = false; if (S.user) { openHashCode(); openDraft(); } });
  $('chatB').addEventListener('click', function () { S.tab = 'chat'; paint(); reload(); });
  $('setB').addEventListener('click', function () { if (S.tab !== 'set') tel('r_settings'); S.tab = S.tab === 'set' ? 'home' : 'set'; paint(); });
  $('login').textContent = T('login'); $('login').addEventListener('click', login);
  $('fCity').placeholder = T('city_f'); $('fCity').addEventListener('input', paint);
  $('fCity').value = '';
  $('gateT').textContent = T('loading'); $('gate').hidden = false;
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.user && !CH.root) reload(); });
  // Beta 5.12.1: teclado do celular — telas sobrepostas acompanham a área visível (visualViewport) para a caixa de texto não ficar escondida
  (function () {
    var v = window.visualViewport, r = document.documentElement;
    function fit() {
      if (!v) return;
      r.style.setProperty('--vvh', Math.round(v.height) + 'px'); r.style.setProperty('--vvt', Math.round(v.offsetTop) + 'px');
      var cl = document.querySelectorAll('.chat .cl'); for (var i = 0; i < cl.length; i++) cl[i].scrollTop = cl[i].scrollHeight;
      var a = document.activeElement; if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.closest && a.closest('.chat,.invs,.um')) { try { a.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
    }
    if (v) { v.addEventListener('resize', fit); v.addEventListener('scroll', fit); fit(); }
    document.addEventListener('focusin', function (e) { var t = e.target; if (t && /^(INPUT|TEXTAREA)$/.test(t.tagName)) setTimeout(function () { try { t.scrollIntoView({ block: 'nearest' }); } catch (x) {} }, 250); });
  })();
  initFB();
  window.__rede = { untag: untag, openResult: openResult, openComposer: openComposer, userMenu: userMenu, S: S, reload: reload, create: create, paint: paint, openChat: openChat };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js').catch(function () {});
})();
