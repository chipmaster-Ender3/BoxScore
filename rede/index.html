<style>:root{--bg:#0A1014;--panel:#16222b;--ink:#eef3f6;--line:#2a3a44;--muted:#8fa2ad;--acc:#c6f24a;--bad:#ff7a6b;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f6f8;--panel:#fff;--ink:#0d1a22;--line:#d3dde3;--muted:#5b6e79;--acc:#4a6b00;--bad:#c0392b;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:12px}
header{display:flex;align-items:center;gap:10px}header h1{flex:1;margin:0;font:900 24px/1 var(--ui);letter-spacing:.02em;text-transform:uppercase}header small{font:700 11px var(--ui);color:var(--muted);letter-spacing:.08em}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--ui);cursor:pointer}.btn.pri{background:var(--ink);color:var(--bg)}.btn.bad{color:var(--bad)}.btn[disabled]{opacity:.5}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:2}
.tabs button{min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:700 13px var(--ui);display:grid;place-items:center;gap:2px;cursor:pointer;position:relative}
.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.dot{position:absolute;top:6px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#0A1014;font:800 11px/18px var(--ui);text-align:center;padding:0 4px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;display:grid;gap:10px}.card.off{opacity:.6}
.when{font:800 18px/1.2 var(--ui)}.sub{color:var(--muted);font:400 13.5px/1.35 var(--ui)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:700 12px/1 var(--ui);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.chip.ok{color:var(--acc);border-color:var(--acc)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.who span{flex:1;min-width:120px;font:600 15px var(--ui)}
label.f{display:grid;gap:5px;font:700 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:500 16px var(--ui);width:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:700 14px var(--ui);cursor:pointer}.seg button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{color:var(--bad);font:600 14px var(--ui)}.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:700 14px var(--ui);z-index:9}</style>

    Promise.all([S.db.collection('links').where('members', 'array-contains', uid).get().catch(function () { return { docs: [] }; })]).then(function (r) {
      var aud = [];
      r[0].docs.forEach(function (d) { var l = d.data(); if (l.status === 'accepted') (l.members || []).forEach(function (m) { if (m !== uid && aud.indexOf(m) < 0) aud.push(m); }); });
      var i = me(), doc = {
        hostUid: uid, hostName: i.name, hostCode: i.code, mode: f.mode, startAt: at, place: place.slice(0, 80), city: city.slice(0, 60), cityKey: norm(city),
        band: f.band, slots: slots, slotsLeft: slots, visibility: f.vis, audience: aud.slice(0, 400), accepted: [uid], asked: [], askedInfo: {}, declined: [],
        players: {}, status: 'open', note: f.note.trim().slice(0, 80), createdAt: Date.now(), updatedAt: Date.now()
      };
      doc.players[uid] = { name: i.name, code: i.code };
      return S.db.collection('games').doc().set(doc);
    }).then(function () { S.form = null; S.tab = 'mine'; toast(T('created')); return reload(); }).catch(function () { f.err = T('fail'); paint(); });
  }

  // ---------- visual ----------
  function fmtWhen(ms) {
    var d = new Date(ms), l = LG === 'pt-BR' ? 'pt-BR' : LG;
    return d.toLocaleDateString(l, { weekday: 'short', day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString(l, { hour: '2-digit', minute: '2-digit' });
  }
  function bandTxt(b) { return T(b === 'beginner' || b === 'intermediate' || b === 'advanced' ? b : 'any'); }
  function twoTap(key, label, cls, fn) {
    var armed = S.armed === key;
    return h('button', { type: 'button', cls: 'btn ' + (cls || ''), text: armed ? T('sure') : label, on: { click: function () { if (S.armed === key) { S.armed = ''; fn(); } else { S.armed = key; paint(); setTimeout(function () { if (S.armed === key) { S.armed = ''; paint(); } }, 3000); } } } });
  }
  function head(g) {
    var st = g.status || 'open', cls = st === 'open' ? 'ok' : st === 'cancelled' ? 'bad' : '';
    return [
      h('div', { cls: 'row' }, [h('div', { cls: 'when', text: fmtWhen(g.startAt) }), h('span', { cls: 'chip ' + cls, text: T('st_' + st) })]),
      h('div', { cls: 'sub', text: g.place + (g.city ? ' · ' + g.city : '') }),
      h('div', { cls: 'row' }, [h('span', { cls: 'chip', text: T(g.mode === 'doubles' ? 'doubles' : 'singles') }), h('span', { cls: 'chip', text: bandTxt(g.band) }), h('span', { cls: 'chip', text: Tf('slots', g.slotsLeft) }), h('span', { cls: 'chip', text: g.visibility === 'open' ? T('open') : T('friends') })]),
      g.note ? h('div', { cls: 'sub', text: '“' + g.note + '”' }) : null
    ];
  }
  function cardFind(g) {
    var uid = S.user.uid, kids = head(g);
    kids.push(h('div', { cls: 'sub', text: Tf('by', g.hostName + (g.hostCode ? ' · ' + g.hostCode : '')) }));
    var inAsk = (g.asked || []).indexOf(uid) >= 0, inDec = (g.declined || []).indexOf(uid) >= 0;
    if (inDec) kids.push(h('span', { cls: 'chip bad', text: T('declined') }));
    else if (inAsk) kids.push(h('div', { cls: 'row' }, [h('span', { cls: 'chip ok', text: T('asked') }), h('button', { type: 'button', cls: 'btn', text: T('cancel_ask'), on: { click: function () { unask(g); } } })]));
    else kids.push(h('button', { type: 'button', cls: 'btn pri', text: T('ask'), on: { click: function () { ask(g); } } }));
    return h('article', { cls: 'card' }, kids);
  }
  function cardMine(g) {
    var uid = S.user.uid, isHost = g.hostUid === uid, kids = head(g), live = g.status === 'open' || g.status === 'full';
    if (!isHost) kids.push(h('div', { cls: 'sub', text: Tf('by', g.hostName + (g.hostCode ? ' · ' + g.hostCode : '')) }));
    if ((g.accepted || []).length) {
      kids.push(h('div', { cls: 'sub', text: T('plrs') }));
      (g.accepted || []).forEach(function (u) { var p = u === g.hostUid ? { name: g.hostName, code: g.hostCode } : (g.players || {})[u] || {}; kids.push(h('div', { cls: 'who' }, [h('span', { text: (p.name || '?') + (p.code ? ' · ' + p.code : '') })])); });
    }
    if (isHost) {
      var asks = g.asked || [];
      if (asks.length && live) {
        kids.push(h('div', { cls: 'sub', text: T('reqs') }));
        asks.forEach(function (u) {
          var p = (g.askedInfo || {})[u] || { name: '?', code: '' };
          kids.push(h('div', { cls: 'who' }, [h('span', { text: p.name + (p.code ? ' · ' + p.code : '') }),
            h('button', { type: 'button', cls: 'btn pri', text: T('accept'), on: { click: function () { accept(g, u); } } }),
            h('button', { type: 'button', cls: 'btn', text: T('decline'), on: { click: function () { decline(g, u); } } })]));
        });
      }
      if (live || g.status === 'started') {
        var row = h('div', { cls: 'row' });
        if (live) { row.appendChild(h('button', { type: 'button', cls: 'btn pri', text: T('start'), on: { click: function () { startGame(g); } } })); }
        row.appendChild(h('button', { type: 'button', cls: 'btn', text: T('share'), on: { click: function () { shareGame(g); } } }));
        if (live) row.appendChild(twoTap('c' + g.id, T('cancel_game'), 'bad', function () { cancelGame(g); }));
        kids.push(row);
      }
    } else {
      if ((g.asked || []).indexOf(uid) >= 0) kids.push(h('div', { cls: 'row' }, [h('span', { cls: 'chip ok', text: T('asked') }), h('button', { type: 'button', cls: 'btn', text: T('cancel_ask'), on: { click: function () { unask(g); } } })]));
      else if ((g.accepted || []).indexOf(uid) >= 0) kids.push(h('span', { cls: 'chip ok', text: T('in_') }));
    }
    return h('article', { cls: 'card' + (live || g.status === 'started' ? '' : ' off') }, kids);
  }
  function shareGame(g) {
    var txt = Tf('share_t', fmtWhen(g.startAt), g.place, g.city || '-', BXMods.base);
    if (navigator.share) navigator.share({ text: txt }).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast('✓'); }, function () {});
  }

  function paintTabs() {
    var host = $('tabs'); host.textContent = '';
    var pend = 0; Object.keys(S.games).forEach(function (k) { var g = S.games[k]; if (g.hostUid === (S.user && S.user.uid) && (g.status === 'open' || g.status === 'full')) pend += (g.asked || []).length; });
    ['find', 'mine', 'neu'].forEach(function (k) {
      var b = h('button', { type: 'button', role: 'tab', 'aria-selected': String(S.tab === k), on: { click: function () { S.tab = k; paint(); } } });
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + '</svg>'; b.appendChild(h('span', { text: T(k) }));
      if (k === 'mine' && pend) b.appendChild(h('span', { cls: 'dot', text: String(pend) }));
      host.appendChild(b);
    });
  }
  function note(host, txt) { host.appendChild(h('div', { cls: 'empty', text: txt })); }
  function paintForm() {
    var host = $('pNew'); host.textContent = '';
    if (!S.form) {
      var d = new Date(Date.now() + 86400000), p = function (n) { return (n < 10 ? '0' : '') + n; };
      S.form = { mode: 'singles', date: d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()), time: '18:00', place: (placar().places || [])[0] || '', city: lsGet('boxscore.rede.city'), slots: 1, band: 'any', vis: 'friends', note: '', err: '' };
    }
    var f = S.form;
    function seg(key, opts) { return h('div', { cls: 'seg' }, opts.map(function (o) { return h('button', { type: 'button', 'aria-pressed': String(f[key] === o[0]), text: o[1], on: { click: function () { f[key] = o[0]; if (key === 'mode' && o[0] === 'singles') f.slots = 1; if (key === 'mode' && o[0] === 'doubles' && f.slots < 2) f.slots = 3; paintForm(); } } }); })); }
    function inp(key, type, extra) { var i = h('input', Object.assign({ type: type, value: f[key] || '' }, extra || {})); i.addEventListener('input', function () { f[key] = i.value; }); return i; }
    function lab(t, c) { return h('label', { cls: 'f' }, [t, c]); }
    var dl = h('datalist', { id: 'plList' }, (placar().places || []).map(function (x) { return h('option', { value: x }); }));
    var band = h('select'); [['any', 'any'], ['beginner', 'beginner'], ['intermediate', 'intermediate'], ['advanced', 'advanced']].forEach(function (o) { var op = h('option', { value: o[0], text: T(o[1]) }); if (f.band === o[0]) op.selected = true; band.appendChild(op); });
    band.addEventListener('change', function () { f.band = band.value; });
    var card = h('div', { cls: 'card' }, [
      lab(T('f_mode'), seg('mode', [['singles', T('singles')], ['doubles', T('doubles')]])),
      h('div', { cls: 'two' }, [lab(T('f_date'), inp('date', 'date')), lab(T('f_time'), inp('time', 'time'))]),
      lab(T('f_place'), inp('place', 'text', { list: 'plList', maxlength: '80', autocomplete: 'off' })), dl,
      lab(T('f_city'), inp('city', 'text', { maxlength: '60' })),
      f.mode === 'doubles' ? lab(T('f_slots'), seg('slots', [[1, '1'], [2, '2'], [3, '3']])) : null,
      lab(T('f_band'), band),
      lab(T('f_vis'), seg('vis', [['friends', T('friends')], ['open', T('open')]])),
      h('div', { cls: 'sub', text: T(f.vis === 'open' ? 'vis_o' : 'vis_f') }),
      lab(T('f_note'), inp('note', 'text', { maxlength: '80' })),
      f.err ? h('div', { cls: 'msg', text: f.err }) : null,
      h('button', { type: 'button', cls: 'btn pri', id: 'bPub', text: T('publish'), on: { click: function () { create(f); } } })
    ]);
    host.appendChild(card);
  }
  function paint() {
    if (!S.user) return;
    paintTabs();
    $('pFind').hidden = S.tab !== 'find'; $('pMine').hidden = S.tab !== 'mine'; $('pNew').hidden = S.tab !== 'neu';
    var uid = S.user.uid, now = Date.now(), all = Object.keys(S.games).map(function (k) { return S.games[k]; });
    var lf = $('lFind'); lf.textContent = '';
    if (S.tab === 'find') {
      var q = norm($('fCity').value);
      var list = all.filter(function (g) { return g.hostUid !== uid && (g.accepted || []).indexOf(uid) < 0 && g.status === 'open' && g.startAt > now - 3 * HOUR && (!q || norm(g.city).indexOf(q) >= 0 || norm(g.place).indexOf(q) >= 0); }).sort(function (a, b) { return a.startAt - b.startAt; });
      if (S.loading && !all.length) note(lf, T('loading')); else if (S.err) note(lf, T('err')); else if (!list.length) note(lf, T('e_find'));
      list.forEach(function (g) { lf.appendChild(cardFind(g)); });
    }
    var lm = $('lMine'); lm.textContent = '';
    if (S.tab === 'mine') {
      var mine = all.filter(function (g) { var inv = g.hostUid === uid || (g.accepted || []).indexOf(uid) >= 0 || (g.asked || []).indexOf(uid) >= 0; return inv && g.startAt > now - 24 * HOUR; }).sort(function (a, b) { return a.startAt - b.startAt; });
      if (S.loading && !all.length) note(lm, T('loading')); else if (S.err) note(lm, T('err')); else if (!mine.length) note(lm, T('e_mine'));
      mine.forEach(function (g) { lm.appendChild(cardMine(g)); });
    }
    if (S.tab === 'neu') paintForm();
  }

  // ---------- início ----------
  $('ttl').textContent = 'BoxScore ' + T('rede'); $('ver').textContent = 'v' + VERSION;
  var b = $('back'); b.textContent = BXMods.t('back'); b.addEventListener('click', function () { BXMods.mark('placar'); location.href = '../placar/'; });
  $('login').textContent = T('login'); $('login').addEventListener('click', login);
  $('fCity').placeholder = T('city_f'); $('fCity').addEventListener('input', paint);
  $('fCity').value = '';
  $('gateT').textContent = T('loading'); $('gate').hidden = false;
  initFB();
  window.__rede = { S: S, reload: reload, create: create, paint: paint };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js').catch(function () {});
})();
</script></body></html>
