<meta name="theme-color" content="#0A1014"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Public+Sans:wght@400;600;700&display=swap">
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png">
<style>:root{--bg:#EDF0F2;--panel:#FFFFFF;--ink:#0E1A22;--muted:#56646E;--line:#CDD5DB;--p1:#C4401B;--p2:#0D6A88;--on-p:#FFFFFF;--acc:#4a6b00;--bad:#B3261E;--overlay:rgba(10,18,24,.55);--display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;--ui:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1014;--panel:#121B21;--ink:#EDF2F5;--muted:#8C9DA7;--line:#25333B;--acc:#c6f24a;--bad:#ff7a6b;--overlay:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1014;--panel:#121B21;--ink:#EDF2F5;--muted:#8C9DA7;--line:#25333B;--acc:#c6f24a;--bad:#ff7a6b;--overlay:rgba(0,0,0,.65);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}[hidden]{display:none!important}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:12px}
main header{display:flex;align-items:center;gap:10px}main header h1{flex:1;margin:0;font:900 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}main header small{font:700 11px var(--ui);color:var(--muted);letter-spacing:.08em}
main .btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--ui);cursor:pointer}main .btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}main .btn.bad{color:var(--bad);border-color:var(--bad)}main .btn[disabled]{opacity:.5}
main .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;background:var(--bg);padding:4px 0;z-index:2}
main .tabs button{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:700 13px var(--ui);display:grid;place-items:center;gap:2px;cursor:pointer;position:relative}
main .tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}main .tabs button[aria-selected=true]{color:var(--panel);background:var(--ink);border-color:var(--ink)}
main .dot{position:absolute;top:6px;right:10px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#0A1014;font:800 11px/18px var(--ui);text-align:center;padding:0 4px}
main .card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;display:grid;gap:10px}main .card.off{opacity:.6}
main .when{font:900 24px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}main .sub{color:var(--muted);font:400 13.5px/1.35 var(--ui)}main .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
main .chip{font:700 12px/1 var(--ui);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}main .chip.ok{color:var(--ink);border-color:var(--ink)}main .chip.bad{color:var(--bad);border-color:var(--bad)}
main .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}main .who>span{flex:1;min-width:120px;font:700 15px var(--ui)}main .who .btn{min-height:40px;padding:0 14px}
main .f{display:grid;gap:6px;font:700 12px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
main input,main select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:400 16px var(--ui);width:100%}
main .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}main .seg button{flex:1;min-height:46px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font:700 14px var(--ui);cursor:pointer}main .seg button:first-child{border-left:0}main .seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
main .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}main .msg{color:var(--bad);font:600 14px var(--ui)}main .empty{text-align:center;color:var(--muted);padding:24px 8px}
.invs{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.invs .btn{min-height:56px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 17px var(--ui);cursor:pointer}.invs .btn.pri{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.invs .chip{font:700 12px/1 var(--ui);padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.invs .sub{color:var(--muted);font:400 14px/1.35 var(--ui)}.invs .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.invs .in{width:100%;max-width:560px;margin:0 auto;display:grid;gap:14px;align-content:center;text-align:center;padding:8px 0}
.invs .top{max-width:560px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;font:700 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.invs h2{margin:0;font:900 40px/1 var(--display);letter-spacing:.02em;text-transform:uppercase}.invs .av{width:84px;height:84px;border-radius:50%;margin:0 auto;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font:800 32px var(--ui);overflow:hidden}.invs .av img{width:100%;height:100%;object-fit:cover}
.invs .who2{font:800 22px var(--ui)}.invs .big{font:900 34px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase}.invs .rowc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.invs .acts{max-width:560px;margin:0 auto;width:100%;display:grid;gap:10px}.invs .acts .btn{min-height:56px;font-size:17px}.invs .acts .two{grid-template-columns:1fr 1fr}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font:700 14px var(--ui);z-index:30}</style>

      list.forEach(function (x) { var on = inv(x); resBox.appendChild(h('div', { cls: 'who' }, [h('span', { text: x.name + (x.code ? ' · ' + x.code : '') }), h('button', { type: 'button', cls: 'btn', text: T('view'), on: { click: function () { showProfile(x.uid, x.name, x); } } }), h('button', { type: 'button', cls: 'btn' + (on ? ' pri' : ''), text: on ? '✓' : T('inv_add'), on: { click: function () { if (on) f.invited = f.invited.filter(function (y) { return y.uid !== x.uid; }); else f.invited.push(x); f.res = list; paintForm(); } } })])); });
    }
    var tmr = null, seq = 0;
    ci.addEventListener('input', function () {
      f.code = ci.value; clearTimeout(tmr); var q = ci.value.trim();
      if (q.length < 2) { f.res = null; drawRes(null === f.res ? undefined : f.res); resBox.textContent = ''; return; }
      var my = ++seq; tmr = setTimeout(function () { searchPlayers(q, function (l) { if (my !== seq) return; f.res = l; drawRes(l); }); }, 350);
    });
    invBox.appendChild(ci); invBox.appendChild(resBox); if (f.res) drawRes(f.res);
    if (!f.invited.length && !S.friends.length) invBox.appendChild(h('div', { cls: 'sub', text: T('inv_none') }));
    // nível
    var lvRow = null;
    if (f.lvSys) { var vs = LV[f.lvSys].map(function (v) { return [v, lvL(f.lvSys, v)]; }); if (!f.lvFrom) f.lvFrom = vs[0][0]; if (!f.lvTo) f.lvTo = vs[vs.length - 1][0]; lvRow = h('div', { cls: 'two' }, [lab(T('lv_from'), sel('lvFrom', vs)), lab(T('lv_to'), sel('lvTo', vs))]); }
    // custo
    var sumEl = h('div', { cls: 'sub', id: 'costSum' });
    function sum() {
      var pr = parseFloat(String(f.price).replace(',', '.')), hr = parseFloat(f.hours) || 1, n = nPlayers({ mode: f.mode });
      sumEl.textContent = isFinite(pr) && pr > 0 ? Tf('cost_tot', money(pr * hr, f.cur)) + ' · ' + Tf('cost_per', money(pr * hr / n, f.cur)) + ' ' + Tf('cost_n', n) : T('cost_none');
    }
    sum();
    var card = h('div', { cls: 'card' }, [
      lab(T('f_mode'), seg('mode', [['singles', T('singles')], ['doubles', T('doubles')]])),
      lab(T('f_vis'), seg('vis', [['invite', T('vis_i')], ['friends', T('friends')], ['open', T('open')]])),
      h('div', { cls: 'sub', text: T(f.vis === 'open' ? 'vis_o' : f.vis === 'invite' ? 'vis_i_t' : 'vis_f') }),
      f.vis === 'invite' ? h('div', { cls: 'f' }, [T('inv_h'), invBox]) : null,
      h('div', { cls: 'two' }, [lab(T('f_date'), inp('date', 'date')), lab(T('f_time'), inp('time', 'time'))]),
      lab(T('f_place'), inp('place', 'text', { list: 'plList', maxlength: '80', autocomplete: 'off' })), dl,
      lab(T('f_city'), inp('city', 'text', { maxlength: '60' })),
      f.mode === 'doubles' ? lab(T('f_slots'), seg('slots', [[1, '1'], [2, '2'], [3, '3']])) : null,
      lab(T('f_level'), sel('lvSys', [['', T('lv_any')], ['cls', T('sys_cls')], ['abc', T('sys_abc')], ['ntrp', T('sys_ntrp')]], function () { f.lvFrom = ''; f.lvTo = ''; paintForm(); })), lvRow,
      h('div', { cls: 'f' }, [T('f_cost'), h('div', { cls: 'card', style: 'background:var(--bg)' }, [
        h('div', { cls: 'two' }, [lab(T('f_hour'), inp('price', 'text', { inputmode: 'decimal', id: 'fPrice', placeholder: '0,00' })), lab(T('f_cur'), sel('cur', [['BRL', 'R$ BRL'], ['EUR', '€ EUR'], ['USD', '$ USD']], sum))]),
        lab(T('f_hours'), sel('hours', [['1', Tf('hrs', 1)], ['1.5', Tf('hrs', 1.5)], ['2', Tf('hrs', 2)], ['3', Tf('hrs', 3)]], sum)), sumEl])]),
      lab(T('f_note'), inp('note', 'text', { maxlength: '80' })),
      f.err ? h('div', { cls: 'msg', text: f.err }) : null,
      h('button', { type: 'button', cls: 'btn pri', id: 'bPub', text: T('publish'), on: { click: function () { create(f); } } })
    ]);
    host.appendChild(card);
  }
  function paint() {
    if (!S.user) return;
    paintTabs();
    $('pFind').hidden = S.tab !== 'find'; $('pMine').hidden = S.tab !== 'mine'; $('pNew').hidden = S.tab !== 'neu';
    var uid = S.user.uid, now = Date.now(), all = Object.keys(S.games).map(function (k) { return S.games[k]; });
    var lf = $('lFind'); lf.textContent = '';
    if (S.tab === 'find') {
      var q = norm($('fCity').value);
      var list = all.filter(function (g) { return g.hostUid !== uid && (g.accepted || []).indexOf(uid) < 0 && (g.declined || []).indexOf(uid) < 0 && g.status === 'open' && g.startAt > now - 3 * HOUR && (!q || norm(g.city).indexOf(q) >= 0 || norm(g.place).indexOf(q) >= 0); }).sort(function (a, b) { return a.startAt - b.startAt; });
      if (S.loading && !all.length) note(lf, T('loading')); else if (S.err) note(lf, T('err')); else if (!list.length) note(lf, T('e_find'));
      list.forEach(function (g) { lf.appendChild(cardFind(g)); });
    }
    var lm = $('lMine'); lm.textContent = '';
    if (S.tab === 'mine') {
      var mine = all.filter(function (g) { var inv = g.hostUid === uid || (g.accepted || []).indexOf(uid) >= 0 || (g.asked || []).indexOf(uid) >= 0; return inv && g.startAt > now - 24 * HOUR; }).sort(function (a, b) { return a.startAt - b.startAt; });
      if (S.loading && !all.length) note(lm, T('loading')); else if (S.err) note(lm, T('err')); else if (!mine.length) note(lm, T('e_mine'));
      mine.forEach(function (g) { lm.appendChild(cardMine(g)); });
    }
    if (S.tab === 'neu') paintForm();
  }

  // ---------- início ----------
  $('ttl').textContent = 'BoxScore ' + T('rede'); $('ver').textContent = 'v' + VERSION;
  var b = $('back'); b.textContent = BXMods.t('back'); b.addEventListener('click', function () { BXMods.mark('placar'); location.href = '../placar/'; });
  $('login').textContent = T('login'); $('login').addEventListener('click', login);
  $('fCity').placeholder = T('city_f'); $('fCity').addEventListener('input', paint);
  $('fCity').value = '';
  $('gateT').textContent = T('loading'); $('gate').hidden = false;
  initFB();
  window.__rede = { S: S, reload: reload, create: create, paint: paint };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('../sw.js').catch(function () {});
})();
